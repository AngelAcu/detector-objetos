<ion-content [fullscreen]="true" class="cam-content">
  <div class="stage">
    <video #video autoplay playsinline muted></video>
    <canvas #canvas></canvas>

    <!-- Barra superior -->
    <div class="top-bar">
      <span class="badge">{{ fps }} FPS</span>
      @if (loading) {
        <span class="badge">Cargando modelo…</span>
      }
      @if (running && !loading) {
        <span class="badge ok">● En vivo</span>
      }
    </div>

    <!-- Chips con conteo por clase -->
    <div class="chips">
      @for (c of counts; track c.label) {
        <span class="chip">{{ c.label }}: {{ c.n }}</span>
      }
    </div>

    <!-- Panel inferior -->
    <div class="panel">
      <div class="slider-row">
        <span>Confianza {{ conf * 100 | number: '1.0-0' }}%</span>
        <ion-range min="0.1" max="0.9" step="0.05" [(ngModel)]="conf"></ion-range>
      </div>

      <div class="buttons">
        <ion-button fill="outline" shape="round" (click)="switchCamera()">
          <ion-icon slot="icon-only" name="camera-reverse-outline"></ion-icon>
        </ion-button>

        <ion-button
          class="main-btn"
          shape="round"
          size="large"
          [color]="running ? 'danger' : 'success'"
          (click)="toggle()"
        >
          <ion-icon slot="start" [name]="running ? 'stop' : 'play'"></ion-icon>
          {{ running ? 'Detener' : 'Iniciar' }}
        </ion-button>
      </div>

      @if (error) {
        <p class="error">{{ error }}</p>
      }
    </div>
  </div>
</ion-content>
